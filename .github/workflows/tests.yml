name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite builds its own synthetic corpus, so there is nothing to fetch
      # and no fixture to keep in sync - it exercises the mismatched frame
      # counts, delays and dimensions that a real uniform export never does.
      - name: Run engine tests
        run: python test_anim_grid.py

      # Drives the real widgets with a hand-pumped event loop.  Skips itself
      # where Tk has no display, so headless Linux runners stay green without
      # needing xvfb.
      - name: Run GUI tests
        run: python test_gui.py
