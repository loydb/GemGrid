name: release

# Builds both distribution shapes on a version tag and attaches them to the
# release, so cutting a release stops depending on one particular laptop having
# PyInstaller installed.  workflow_dispatch runs everything except the upload,
# which makes the build verifiable without minting a throwaway tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Never ship a binary that has not passed its own suite.
      - name: Run tests
        run: |
          python test_anim_grid.py
          python test_gui.py

      - name: Build single-file exe
        run: python build_exe.py

      # A --windowed exe detaches from the console, so the exit code has to be
      # collected via Start-Process -Wait rather than by running it directly.
      # The self-test proves the frozen bundle can decode GIFs and encode an
      # animated WebP - a PyInstaller build can look healthy and still be
      # missing Pillow's WebP codec.
      - name: Self-test single-file exe
        run: |
          $p = Start-Process .\dist\GemGrid.exe -ArgumentList "--selftest","onefile.txt" -PassThru -Wait
          Get-Content onefile.txt
          if ($p.ExitCode -ne 0) { throw "onefile self-test failed ($($p.ExitCode))" }

      - name: Build onedir bundle
        run: python build_exe.py --onedir

      - name: Self-test onedir bundle
        run: |
          $p = Start-Process .\dist\GemGrid\GemGrid.exe -ArgumentList "--selftest","onedir.txt" -PassThru -Wait
          Get-Content onedir.txt
          if ($p.ExitCode -ne 0) { throw "onedir self-test failed ($($p.ExitCode))" }

      - name: Package onedir bundle
        id: package
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if (-not $v -or "${{ github.ref_type }}" -ne "tag") { $v = "dev" }
          $zip = "dist/GemGrid-$v-windows-onedir.zip"
          Compress-Archive -Path dist/GemGrid -DestinationPath $zip -CompressionLevel Optimal
          # guard against the empty-archive failure mode seen when a source
          # tree is partially locked during compression
          $n = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.Count
          if ($n -lt 100) { throw "archive has only $n entries - build tree incomplete" }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "entries: $n"

      - name: Checksums
        id: sums
        run: |
          $a = (Get-FileHash dist/GemGrid.exe -Algorithm SHA256).Hash.ToLower()
          $b = (Get-FileHash "${{ steps.package.outputs.zip }}" -Algorithm SHA256).Hash.ToLower()
          "exe=$a" >> $env:GITHUB_OUTPUT
          "zip=$b" >> $env:GITHUB_OUTPUT
          "sha256  $a  GemGrid.exe"
          "sha256  $b  $(Split-Path '${{ steps.package.outputs.zip }}' -Leaf)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GemGrid-${{ github.ref_name }}
          path: |
            dist/GemGrid.exe
            ${{ steps.package.outputs.zip }}

      # Pushing a tag creates a tag, not a Release, so `gh release upload` has
      # nothing to attach to on a first publish - it fails with "release not
      # found".  Create it when absent, then upload either way, so the step
      # works both for a fresh tag and for re-running against an existing
      # release.
      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "creating release $tag"
            gh release create $tag --title "GemGrid $tag" --notes-from-tag
            if ($LASTEXITCODE -ne 0) { throw "could not create release $tag" }
          } else {
            Write-Host "release $tag already exists - updating assets"
          }
          gh release upload $tag dist/GemGrid.exe "${{ steps.package.outputs.zip }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "asset upload failed" }

      # Hashes are computed from the artifacts that were actually uploaded, so
      # published checksums always describe the published files.  Hand-written
      # ones only ever described whatever was built locally at the time.
      # The existing block is stripped first, so re-running is idempotent.
      - name: Publish checksums into the release notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = Split-Path "${{ steps.package.outputs.zip }}" -Leaf
          $body = gh release view $tag --json body --jq .body
          if ($LASTEXITCODE -ne 0) { throw "could not read release notes" }
          $marker = "## Checksums"
          $i = $body.IndexOf($marker)
          if ($i -ge 0) { $body = $body.Substring(0, $i).TrimEnd() }
          # built line by line rather than with a here-string: PowerShell wants
          # the here-string terminator at column 0, which YAML block scalars
          # cannot express
          # cast to string before repeating: [char] * [int] is not an operator
          $fence = ([string][char]0x60) * 3
          $run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $block = @(
            ""
            ""
            $marker
            ""
            $fence
            "sha256  ${{ steps.sums.outputs.exe }}  GemGrid.exe"
            "sha256  ${{ steps.sums.outputs.zip }}  $zipName"
            $fence
            ""
            "Built and published by [this workflow run]($run)."
          ) -join "`n"
          Set-Content -Path notes.md -Value ($body + $block) -Encoding utf8
          gh release edit $tag --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw "could not update release notes" }
          Get-Content notes.md | Select-Object -Last 10
